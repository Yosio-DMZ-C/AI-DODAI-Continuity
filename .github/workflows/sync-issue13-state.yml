name: AD&C Issue 13 current-state sync

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: adnc-issue13-current-state
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 13 &&
       github.event.comment.user.login == 'Yosio-DMZ-C' &&
       startsWith(github.event.comment.body, 'ADNC-STATE-V1'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Self-test deterministic state reducer
        run: python3 scripts/sync_issue13_state.py --self-test
      - name: Rebuild and read back Issue 13 current state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sync_issue13_state.py
