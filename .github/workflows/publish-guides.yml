name: Publish AD&C unified guide (legacy preserved)

on:
  push:
    branches: [main]
    paths:
      - 'docs/AgentOS-C_設計・構築運用指示書_一般配布版.md'
      - '.github/workflows/publish-guides.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentos-c-guide-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Prepare Markdown downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp 'docs/AgentOS-C_設計・構築運用指示書_一般配布版.md' 'dist/AgentOS-C_Guide.md'
          test -s 'dist/AgentOS-C_Guide.md'
          grep -q '^# AD&C' 'dist/AgentOS-C_Guide.md'
          grep -Eq '^- 配布版：[0-9]+\.[0-9]+\.[0-9]+' 'dist/AgentOS-C_Guide.md'
          grep -Fq 'https://github.com/Yosio-DMZ-C/AI-DODAI-Continuity/blob/main/docs/updates/UPDATE.md' 'dist/AgentOS-C_Guide.md'

      - name: Publish current guide without altering legacy free asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='guides-current'
          artifact='AgentOS-C_Guide.md'
          legacy='AgentOS-C_Free_Guide.md'
          expected_legacy='sha256:056bc3fea84faadf1311317a7b026ae8ff649b26c2316175cd0c9cbcb56fd'

          # The legacy release and its historical free asset must exist.
          # Never silently recreate the tag or change the legacy download.
          gh release view "$tag" >/dev/null
          old_legacy="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets[] | select(.name=="AgentOS-C_Free_Guide.md") | .digest')"
          if [ "$old_legacy" != "$expected_legacy" ]; then
            echo "::error::Legacy asset digest changed or missing; refusing publish"
            exit 1
          fi

          # Retain the established primary download URL while publishing
          # the ONE unified installer. Keep the legacy free file untouched.
          local_sha="$(sha256sum "dist/$artifact" | awk '{print $1}')"
          gh release upload "$tag" "dist/$artifact" --clobber

          gh release edit "$tag" \
            --title 'AD&C 設計・構築運用指示書（共通インストーラー最新版）' \
            --notes '推奨：AgentOS-C_Guide.md（現在のAD&C共通インストーラー。従来URLとの互換のため旧ファイル名を維持）。AgentOS-C_Free_Guide.mdは旧v1.2.1の履歴・互換資産であり、新規導入には使わない。配布元はmain、旧配布原本のSHA一致記録はdocs/archive/RELEASE_GUIDES_20261014.mdを参照。'

          after_json="$(gh api "repos/$GH_REPO/releases/tags/$tag")"
          published_sha="$(printf '%s' "$after_json" | jq -r '.assets[] | select(.name=="AgentOS-C_Guide.md") | .digest')"
          legacy_sha="$(printf '%s' "$after_json" | jq -r '.assets[] | select(.name=="AgentOS-C_Free_Guide.md") | .digest')"
          if [ "$published_sha" != "sha256:$local_sha" ]; then
            echo "::error::Primary release digest mismatch"
            exit 1
          fi
          if [ "$legacy_sha" != "$expected_legacy" ]; then
            echo "::error::Legacy digest changed after publish"
            exit 1
          fi
          echo "PASS: unified guide published; archived free asset unchanged"
