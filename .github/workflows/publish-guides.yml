name: Publish AD&C unified guide (legacy preserved)

on:
  push:
    branches: [main]
    paths:
      - 'docs/AgentOS-C_設計・構築運用指示書_一般配布版.md'
      - '.github/workflows/publish-guides.yml'
      - 'scripts/build_offline_installer.py'
      - 'docs/PROJECT_EXECUTION_STANDARD.md'
      - 'docs/updates/**'
      - 'docs/OFFLINE_INSTALLER.md'
      - 'docs/wiki/Getting-Started.md'
      - 'docs/wiki/Upload-File.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentos-c-guide-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check out public AD&C shared Playbooks for offline snapshot
        uses: actions/checkout@v4
        with:
          repository: Yosio-DMZ-C/AD-C-Shared-Knowledge
          ref: main
          path: vendor/shared-kb
          persist-credentials: false

      - name: Prepare Markdown downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp 'docs/AgentOS-C_設計・構築運用指示書_一般配布版.md' 'dist/AgentOS-C_Guide.md'
          test -s 'dist/AgentOS-C_Guide.md'
          grep -q '^# AD&C' 'dist/AgentOS-C_Guide.md'
          grep -Eq '^- 配布版：[0-9]+\.[0-9]+\.[0-9]+' 'dist/AgentOS-C_Guide.md'
          grep -Fq 'https://github.com/Yosio-DMZ-C/AI-DODAI-Continuity/blob/main/docs/updates/UPDATE.md' 'dist/AgentOS-C_Guide.md'
          # Prevent a stale installer version in any executable setup instruction.
          python3 - <<'PY'
          import json
          import pathlib
          import re

          guide = pathlib.Path("dist/AgentOS-C_Guide.md").read_text(encoding="utf-8")
          manifest = json.loads(pathlib.Path("docs/updates/LATEST.json").read_text(encoding="utf-8"))
          latest = manifest["latest_version"]
          title = re.search(r"(?m)^- 配布版：(\d+\.\d+\.\d+)", guide)
          setup_versions = re.findall(r"ADNC_INSTALLER_VERSION:\s*(\d+\.\d+\.\d+)", guide)
          if not title or title.group(1) != latest or not setup_versions or any(v != latest for v in setup_versions):
              raise SystemExit(f"FAIL: manifest={latest}, guide_title={title.group(1) if title else None}, setup_versions={setup_versions}")
          print(f"PASS: manifest/header/setup versions match {latest}; setup entries={len(setup_versions)}")
          PY

      - name: Build and verify offline installer transport kit
        shell: bash
        run: |
          set -euo pipefail
          test -s 'vendor/shared-kb/skills/communication-navigation/SKILL.md'
          test -s 'vendor/shared-kb/skills/loop-development/SKILL.md'
          python3 scripts/build_offline_installer.py --outdir dist
          test -s 'dist/ADNC_Offline_Installer_Current.zip'
          test -s 'dist/ADNC_Offline_Installer_Current.md'

      - name: Publish unified guide, legacy retirement notice and offline installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='guides-current'
          artifact='AgentOS-C_Guide.md'
          legacy='AgentOS-C_Free_Guide.md'
          offline_zip='ADNC_Offline_Installer_Current.zip'
          offline_md='ADNC_Offline_Installer_Current.md'
          mkdir -p dist
          cp 'docs/AgentOS-C_設計・構築運用指示書_AI無課金ユーザー版.md' "dist/$legacy"
          test -s "dist/$legacy"
          grep -Fq 'ADNC:LEGACY_INSTALLER_RETIRED_20261111' "dist/$legacy"
          grep -Fq '現行共通インストーラー' "dist/$legacy"
          primary_sha="$(sha256sum "dist/$artifact" | awk '{print $1}')"
          legacy_sha="$(sha256sum "dist/$legacy" | awk '{print $1}')"
          zip_sha="$(sha256sum "dist/$offline_zip" | awk '{print $1}')"
          md_sha="$(sha256sum "dist/$offline_md" | awk '{print $1}')"

          # Old fixed download URL stays valid, but may no longer execute 1.2.1.
          gh release view "$tag" >/dev/null
          gh release upload "$tag" "dist/$artifact" "dist/$legacy" "dist/$offline_zip" "dist/$offline_md" --clobber
          gh release edit "$tag" \
            --title 'AD&C 設計・構築運用指示書（共通インストーラー最新版）' \
            --notes '正式名称：AD&C。AgentOS-C（AIをエージェントにするOS）はコンセプト副題・歴史名称です。新規導入：AgentOS-C_Guide.md（mainの現行共通インストーラー）。社内等の外部Markdown取得制限向け：ADNC_Offline_Installer_Current.zip（導入資料・共通実行標準・標準コミュニケーション・改善ループ・版情報・更新手順の一括添付キット）／ADNC_Offline_Installer_Current.md（ZIP非対応AIの単一Markdown代替）。旧AgentOS-C_Free_Guide.mdは廃止案内でインストーラーではありません。ZIPは個人KBや外部共有KB全体ではありません。旧1.2.1原文とSHAはGit履歴およびdocs/archive/RELEASE_GUIDES_20261014.mdを参照。'

          # Independently download the actual Release assets after publishing.
          mkdir -p published-release
          gh release download "$tag" --pattern "$artifact" --dir published-release --clobber
          gh release download "$tag" --pattern "$legacy" --dir published-release --clobber
          gh release download "$tag" --pattern "$offline_zip" --dir published-release --clobber
          gh release download "$tag" --pattern "$offline_md" --dir published-release --clobber
          primary_readback="$(sha256sum "published-release/$artifact" | awk '{print $1}')"
          legacy_readback="$(sha256sum "published-release/$legacy" | awk '{print $1}')"
          zip_readback="$(sha256sum "published-release/$offline_zip" | awk '{print $1}')"
          md_readback="$(sha256sum "published-release/$offline_md" | awk '{print $1}')"
          if [ "$primary_readback" != "$primary_sha" ] || [ "$legacy_readback" != "$legacy_sha" ] || [ "$zip_readback" != "$zip_sha" ] || [ "$md_readback" != "$md_sha" ]; then
            echo '::error::Release byte-level readback SHA mismatch'
            exit 1
          fi
          echo 'PASS: unified guide + offline ZIP + Markdown fallback; legacy free guide remains a retirement notice; SHA-256 Release readback matches'
          printf 'Offline ZIP: https://github.com/%s/releases/download/%s/%s\n' "$GH_REPO" "$tag" "$offline_zip"
          printf 'Offline Markdown: https://github.com/%s/releases/download/%s/%s\n' "$GH_REPO" "$tag" "$offline_md"
