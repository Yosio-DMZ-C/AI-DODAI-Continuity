name: AD&C YouTube OAuth tests
on:
  push:
    branches:
      - 'feature/adnc-youtube-tools-v0-2-20261020'
    paths:
      - 'tools/youtube/worker.oauth.v0.4.3.mjs'
      - 'tools/youtube/tests/oauth_v043_smoke.test.mjs'
      - '.github/workflows/test-adnc-youtube-oauth.yml'
  pull_request:
    paths:
      - 'tools/youtube/worker.oauth.v0.4.3.mjs'
      - 'tools/youtube/tests/oauth_v043_smoke.test.mjs'
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check tools/youtube/worker.oauth.v0.4.3.mjs
      - name: Offline route/CSP regression tests
        run: node --test tools/youtube/tests/oauth_v043_smoke.test.mjs
