name: AD&C beta work-state preflight tests

on:
  pull_request:
    paths:
      - 'scripts/adnc_resume_preflight.py'
      - '.github/workflows/check-work-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python standard-library boundary tests
        run: python3 scripts/adnc_resume_preflight.py --self-test
      - name: Fictional 4-of-15 resume demonstration
        run: python3 scripts/adnc_resume_preflight.py --demo
